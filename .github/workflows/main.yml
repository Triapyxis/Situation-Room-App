name: Build installer
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: situation-room
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build installer
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Situation-Room-Setup
          path: situation-room/dist/*.exe
